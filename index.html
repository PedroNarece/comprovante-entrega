Nota de Desenvolvimento:

evoluindo em paralelo com a minha graduação em Engenharia da Computação.
A visão do produto, arquitetura de dados e validação do fluxo foram estruturadas 
por mim. O código-fonte foi escrito, refatorado e auditado em colaboração com

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProofSnap - Motorista</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        input[type="text"] { padding: 10px; font-size: 16px; margin-top: 10px; width: 80%; max-width: 300px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 15px 30px; font-size: 18px; margin-top: 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 8px; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        input[type="file"] { margin-top: 20px; font-size: 16px; }
        #mensagem { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ProofSnap</h1>
    <form id="formulario-foto">
        <input type="text" id="numero-carga" placeholder="Número da Carga" required><br>
        <input type="text" id="nome-motorista" placeholder="Nome do Motorista" required><br>
        <input type="file" id="foto-canhoto" accept="image/jpeg,image/png,image/webp" capture="environment" required><br>
        <button type="submit" id="botao-enviar">Enviar Canhoto</button>
    </form>
    <p id="mensagem"></p>

    <script>
        let db, sincronizando = false;
        const requestDB = indexedDB.open("ProofSnapDB", 1);
        
        requestDB.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("entregas", { keyPath: "id" }); };
        requestDB.onsuccess = (e) => { db = e.target.result; sincronizarFila(); };
        requestDB.onerror = () => console.error("Erro ao abrir base de dados.");

        function gerarUUID() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        document.getElementById('formulario-foto').addEventListener('submit', async function(evento) {
            evento.preventDefault(); 
            const botao = document.getElementById('botao-enviar'), msg = document.getElementById('mensagem');
            const arquivo = document.getElementById('foto-canhoto').files[0];
            const campoCarga = document.getElementById('numero-carga');
            const campoMotorista = document.getElementById('nome-motorista');
            
            if (!arquivo) return;

            const cargaValor = campoCarga.value.trim();
            const motoristaValor = campoMotorista.value.trim();

            // === PADRÃO FAIL FAST (Validação antes de gastar recursos ou salvar no IndexedDB) ===
            // 1. Validação da Carga (somente números)
            if (!/^\d+$/.test(cargaValor)) {
                msg.innerText = "Erro: O número da carga deve conter apenas dígitos.";
                msg.style.color = "red";
                return;
            }

            // 2. Validação do Tipo MIME da foto
            const formatosValidos = ["image/jpeg", "image/png", "image/webp"];
            if (!formatosValidos.includes(arquivo.type)) {
                msg.innerText = "Formato não suportado. Apenas fotos JPEG, PNG ou WEBP.";
                msg.style.color = "red";
                return;
            }

            // 3. Validação do Tamanho Máximo (10 Megabytes)
            const LIMITE_TAMANHO = 10 * 1024 * 1024;
            if (arquivo.size > LIMITE_TAMANHO) {
                const tamanhoMB = (arquivo.size / (1024 * 1024)).toFixed(1);
                msg.innerText = `Foto muito pesada (${tamanhoMB} MB). O limite é 10 MB.`;
                msg.style.color = "red";
                return;
            }

            botao.disabled = true;
            msg.innerText = "Processando...";
            msg.style.color = "black";
            const id_entrega = gerarUUID();

            try {
                if (navigator.onLine) await tentarEnviar(id_entrega, cargaValor, motoristaValor, arquivo, msg);
                else await guardarOffline(id_entrega, cargaValor, motoristaValor, arquivo, msg);
            } finally {
                // Item 1: finally engloba ambas as chamadas e assegura o desbloqueio
                botao.disabled = false;
            }
        });

        async function tentarEnviar(id, carga, motorista, arquivo, msgTag) {
            const p = new FormData();
            p.append('foto', arquivo); p.append('carga', carga); p.append('motorista', motorista); p.append('id_entrega', id);
            try {
                const res = await fetch('/upload/', { method: 'POST', body: p });
                if (res.ok) {
                    msgTag.innerText = "Canhoto enviado!";
                    msgTag.style.color = "green";
                    document.getElementById('formulario-foto').reset();
                } else if (res.status >= 400 && res.status < 500) {
                    // Item 5: parse defensivo do JSON
                    let txtErro = "Dados inválidos.";
                    try {
                        const json = await res.json();
                        if (typeof json.detail === "string") txtErro = json.detail;
                    } catch (e) { txtErro = "Erro " + res.status; }
                    msgTag.innerText = "Rejeitado: " + txtErro;
                    msgTag.style.color = "red";
                } else await guardarOffline(id, carga, motorista, arquivo, msgTag);
            } catch (e) { await guardarOffline(id, carga, motorista, arquivo, msgTag); }
        }

        function guardarOffline(id, carga, motorista, arquivo, msgTag) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const req = db.transaction(["entregas"], "readwrite").objectStore("entregas").add({ id, carga, motorista, foto: arquivo });
                req.onsuccess = () => {
                    msgTag.innerText = "Guardado para envio automático.";
                    msgTag.style.color = "orange";
                    document.getElementById('formulario-foto').reset();
                    resolve();
                };
                req.onerror = () => { msgTag.innerText = "Erro local (memória cheia?)."; msgTag.style.color = "red"; resolve(); }; // Item 2
            });
        }

        async function sincronizarFila() {
            if (sincronizando || !navigator.onLine || !db) return;
            sincronizando = true;
            try {
                const entregas = await new Promise((res, rej) => {
                    const req = db.transaction(["entregas"]).objectStore("entregas").getAll();
                    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
                });
                if (entregas.length === 0) return;

                let enviados = 0, rejeitados = 0; // Item 3
                for (let e of entregas) {
                    const p = new FormData();
                    p.append('foto', e.foto); p.append('carga', e.carga); p.append('motorista', e.motorista); p.append('id_entrega', e.id); 
                    try {
                        const res = await fetch('/upload/', { method: 'POST', body: p });
                        if (res.ok || (res.status >= 400 && res.status < 500)) {
                            await new Promise(r => {
                                const reqDel = db.transaction(["entregas"], "readwrite").objectStore("entregas").delete(e.id);
                                reqDel.onsuccess = r; reqDel.onerror = r;
                            });
                            if (res.ok) enviados++; else rejeitados++;
                        }
                    } catch (err) {}
                }
                
                // Item 4: Só notifica se tiver ocorrido atividade no lote
                if (enviados > 0 || rejeitados > 0) {
                    const msg = document.getElementById('mensagem');
                    msg.innerText = `Sincronização: ${enviados} enviados, ${rejeitados} rejeitados.`;
                    msg.style.color = rejeitados > 0 ? "orange" : "green";
                }
            } finally { sincronizando = false; }
        }
        window.addEventListener('online', sincronizarFila);
        setInterval(sincronizarFila, 30000);
    </script>
</body>
</html>
