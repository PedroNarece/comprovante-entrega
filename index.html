<!--
ProofSnap - Delivery Receipt Capture & Validation
Autor: Pedro Narece Silva Guimarães
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProofSnap - Motorista</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Barra de Topo com Status da Rede */
        header {
            width: 100%;
            background: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-title { font-size: 18px; font-weight: 800; color: #0284c7; margin: 0; }
        .rede-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .rede-online { background-color: #dcfce7; color: #15803d; }
        .rede-offline { background-color: #fef3c7; color: #b45309; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-online { background-color: #16a34a; }
        .dot-offline { background-color: #d97706; }

        /* Container Principal */
        main {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Cartão do Formulário */
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        label { font-size: 13px; font-weight: 600; color: #475569; }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            background: #f8fafc;
        }
        input[type="text"]:focus {
            border-color: #0284c7;
            background: white;
        }

        /* Botão Customizado de Captura de Foto */
        .foto-container {
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .foto-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .btn-camera {
            width: 100%;
            background-color: #f8fafc;
            border: 2px dashed #94a3b8;
            color: #334155;
            padding: 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-camera:active { background-color: #e2e8f0; }
        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Pré-visualização da Imagem */
        #preview-container {
            display: none;
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            background: #000;
        }
        #preview-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            display: block;
        }
        .btn-remover-foto {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.65);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Botão de Envio */
        .btn-enviar {
            width: 100%;
            background: #0284c7;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-enviar:active { transform: scale(0.98); }
        .btn-enviar:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Mensagens de Feedback */
        #mensagem {
            width: 100%;
            margin-top: 10px;
        }
        
        /* Rodapé Informativo */
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <span style="font-size: 20px;">📦</span>
            <h1 class="logo-title">ProofSnap</h1>
        </div>
        <div id="badge-rede" class="rede-badge rede-online">
            <span id="dot-rede" class="dot dot-online"></span>
            <span id="texto-rede">Online</span>
        </div>
    </header>

    <main>
        <div class="card">
            <form id="formulario-foto">
                <div class="campo-grupo">
                    <label for="numero-carga">Número da Carga</label>
                    <input type="text" id="numero-carga" inputmode="numeric" placeholder="Ex: 4434" required>
                </div>

                <div class="campo-grupo">
                    <label for="nome-motorista">Nome do Motorista</label>
                    <input type="text" id="nome-motorista" placeholder="Ex: Pedro Silva" required>
                </div>

                <div class="foto-container">
                    <label>Comprovante de Entrega (Canhoto)</label>
                    
                    <div class="foto-btn-wrapper" id="camera-picker">
                        <div class="btn-camera">
                            <span style="font-size: 28px;">📷</span>
                            <span>Tirar Foto do Canhoto</span>
                            <small style="color: #64748b; font-weight: normal;">Câmera traseira nativa</small>
                        </div>
                        <input type="file" id="foto-canhoto" accept="image/jpeg,image/png,image/webp" capture="environment" required>
                    </div>

                    <div id="preview-container">
                        <img id="preview-img" src="" alt="Pré-visualização">
                        <button type="button" class="btn-remover-foto" id="btn-remover">✕ Trocar Foto</button>
                    </div>
                </div>

                <button type="submit" class="btn-enviar" id="botao-enviar">
                    <span>Enviar Canhoto</span>
                </button>
            </form>

            <div id="mensagem"></div>
        </div>
    </main>

    <footer>
        ProofSnap v3 • Auditoria Inteligente com Google Gemini
    </footer>

    <script>
        let db, sincronizando = false;
        const requestDB = indexedDB.open("ProofSnapDB", 1);
        
        requestDB.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("entregas", { keyPath: "id" }); };
        requestDB.onsuccess = (e) => { db = e.target.result; sincronizarFila(); };
        requestDB.onerror = () => console.error("Erro ao abrir base de dados.");

        // Atualização visual do status de conexão
        function atualizarStatusRede() {
            const badge = document.getElementById('badge-rede');
            const dot = document.getElementById('dot-rede');
            const texto = document.getElementById('texto-rede');
            
            if (navigator.onLine) {
                badge.className = "rede-badge rede-online";
                dot.className = "dot dot-online";
                texto.innerText = "Online";
                sincronizarFila();
            } else {
                badge.className = "rede-badge rede-offline";
                dot.className = "dot dot-offline";
                texto.innerText = "Modo Offline";
            }
        }
        window.addEventListener('online', atualizarStatusRede);
        window.addEventListener('offline', atualizarStatusRede);
        atualizarStatusRede();

        // Preview da Foto Selecionada
        const inputFoto = document.getElementById('foto-canhoto');
        const cameraPicker = document.getElementById('camera-picker');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');
        const btnRemover = document.getElementById('btn-remover');

        inputFoto.addEventListener('change', function() {
            const arquivo = this.files[0];
            if (arquivo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    cameraPicker.style.display = "none";
                    previewContainer.style.display = "block";
                };
                reader.readAsDataURL(arquivo);
            }
        });

        btnRemover.addEventListener('click', function() {
            inputFoto.value = "";
            previewImg.src = "";
            previewContainer.style.display = "none";
            cameraPicker.style.display = "block";
        });

        function gerarUUID() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        document.getElementById('formulario-foto').addEventListener('submit', async function(evento) {
            evento.preventDefault(); 
            const botao = document.getElementById('botao-enviar'), msg = document.getElementById('mensagem');
            const arquivo = inputFoto.files[0];
            const campoCarga = document.getElementById('numero-carga');
            const campoMotorista = document.getElementById('nome-motorista');
            
            if (!arquivo) return;

            const cargaValor = campoCarga.value.trim();
            const motoristaValor = campoMotorista.value.trim();

            // === PADRÃO FAIL FAST ===
            if (!/^\d+$/.test(cargaValor)) {
                msg.innerHTML = `<div style="color: #b91c1c; font-size: 14px; font-weight: 600; padding: 10px; background: #fee2e2; border-radius: 8px;">A carga deve conter apenas números.</div>`;
                return;
            }

            const formatosValidos = ["image/jpeg", "image/png", "image/webp"];
            if (!formatosValidos.includes(arquivo.type)) {
                msg.innerHTML = `<div style="color: #b91c1c; font-size: 14px; font-weight: 600; padding: 10px; background: #fee2e2; border-radius: 8px;">Formato inválido. Apenas fotos JPEG, PNG ou WEBP.</div>`;
                return;
            }

            const LIMITE_TAMANHO = 10 * 1024 * 1024;
            if (arquivo.size > LIMITE_TAMANHO) {
                const tamanhoMB = (arquivo.size / (1024 * 1024)).toFixed(1);
                msg.innerHTML = `<div style="color: #b91c1c; font-size: 14px; font-weight: 600; padding: 10px; background: #fee2e2; border-radius: 8px;">Foto muito pesada (${tamanhoMB} MB). Limite de 10 MB.</div>`;
                return;
            }

            botao.disabled = true;
            botao.innerHTML = `<span>Auditando com IA... ⏳</span>`;
            msg.innerHTML = "";
            const id_entrega = gerarUUID();

            try {
                if (navigator.onLine) await tentarEnviar(id_entrega, cargaValor, motoristaValor, arquivo, msg);
                else await guardarOffline(id_entrega, cargaValor, motoristaValor, arquivo, msg);
            } finally {
                botao.disabled = false;
                botao.innerHTML = `<span>Enviar Canhoto</span>`;
            }
        });

        async function tentarEnviar(id, carga, motorista, arquivo, msgTag) {
            const p = new FormData();
            p.append('foto', arquivo); p.append('carga', carga); p.append('motorista', motorista); p.append('id_entrega', id);
            try {
                const res = await fetch('/upload/', { method: 'POST', body: p });
                if (res.ok) {
                    const dados = await res.json();
                    
                    if (dados.status === "APROVADO") {
                        msgTag.innerHTML = `
                            <div style="background: #dcfce7; border: 1.5px solid #86efac; color: #166534; padding: 14px; border-radius: 12px; margin-top: 15px;">
                                <strong style="font-size: 16px;">Canhoto Aprovado pela IA! ✅</strong><br>
                                <span style="font-size: 13px; color: #15803d; display: block; margin-top: 4px;">${dados.motivo_ia || "Documento válido e assinado."}</span>
                            </div>
                        `;
                    } else if (dados.status === "REJEITADO") {
                        msgTag.innerHTML = `
                            <div style="background: #fee2e2; border: 1.5px solid #fca5a5; color: #991b1b; padding: 14px; border-radius: 12px; margin-top: 15px;">
                                <strong style="font-size: 16px;">Atenção: Canhoto Rejeitado! ⚠️</strong><br>
                                <span style="font-size: 13px; color: #b91c1c; display: block; margin-top: 4px;">${dados.motivo_ia || "Foto sem assinatura ou ilegível."}</span>
                                <small style="display:block; margin-top: 8px; color: #475569; font-weight: 600;">Por favor, tire outra foto focada com a assinatura visível.</small>
                            </div>
                        `;
                    } else {
                        msgTag.innerHTML = `<div style="background: #dcfce7; color: #15803d; padding: 12px; border-radius: 8px;">Canhoto enviado com sucesso!</div>`;
                    }
                    
                    document.getElementById('formulario-foto').reset();
                    btnRemover.click(); // Reseta o preview
                } else if (res.status >= 400 && res.status < 500) {
                    let txtErro = "Dados inválidos.";
                    try {
                        const json = await res.json();
                        if (typeof json.detail === "string") txtErro = json.detail;
                    } catch (e) { txtErro = "Erro " + res.status; }
                    msgTag.innerHTML = `<div style="background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px;">Rejeitado pelo servidor: ${txtErro}</div>`;
                } else await guardarOffline(id, carga, motorista, arquivo, msgTag);
            } catch (e) { await guardarOffline(id, carga, motorista, arquivo, msgTag); }
        }

        function guardarOffline(id, carga, motorista, arquivo, msgTag) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const req = db.transaction(["entregas"], "readwrite").objectStore("entregas").add({ id, carga, motorista, foto: arquivo });
                req.onsuccess = () => {
                    msgTag.innerHTML = `
                        <div style="background: #fef3c7; border: 1.5px solid #fde68a; color: #92400e; padding: 14px; border-radius: 12px; margin-top: 15px;">
                            <strong style="font-size: 15px;">Salvo Offline no Celular! 📦</strong><br>
                            <span style="font-size: 13px;">Sem sinal de internet. O canhoto será enviado automaticamente assim que a conexão voltar.</span>
                        </div>
                    `;
                    document.getElementById('formulario-foto').reset();
                    btnRemover.click();
                    resolve();
                };
                req.onerror = () => {
                    msgTag.innerHTML = `<div style="background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px;">Erro ao guardar offline (memória cheia?).</div>`;
                    resolve();
                };
            });
        }

        async function sincronizarFila() {
            if (sincronizando || !navigator.onLine || !db) return;
            sincronizando = true;
            try {
                const entregas = await new Promise((res, rej) => {
                    const req = db.transaction(["entregas"]).objectStore("entregas").getAll();
                    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
                });
                if (entregas.length === 0) return;

                let enviados = 0, rejeitados = 0;
                for (let e of entregas) {
                    const p = new FormData();
                    p.append('foto', e.foto); p.append('carga', e.carga); p.append('motorista', e.motorista); p.append('id_entrega', e.id); 
                    try {
                        const res = await fetch('/upload/', { method: 'POST', body: p });
                        if (res.ok || (res.status >= 400 && res.status < 500)) {
                            await new Promise(r => {
                                const reqDel = db.transaction(["entregas"], "readwrite").objectStore("entregas").delete(e.id);
                                reqDel.onsuccess = r; reqDel.onerror = r;
                            });
                            if (res.ok) enviados++; else rejeitados++;
                        }
                    } catch (err) {}
                }
                
                if (enviados > 0 || rejeitados > 0) {
                    const msg = document.getElementById('mensagem');
                    msg.innerHTML = `
                        <div style="background: #e0f2fe; border: 1.5px solid #bae6fd; color: #0369a1; padding: 12px; border-radius: 8px; margin-top: 10px;">
                            Sincronização em lote concluída: <strong>${enviados} enviados</strong>, ${rejeitados} rejeitados.
                        </div>
                    `;
                }
            } finally { sincronizando = false; }
        }
        setInterval(sincronizarFila, 30000);
    </script>
</body>
</html>
